[build-system]
requires = ['hatchling']
build-backend = 'hatchling.build'

[project]
name = 'baenggipyo'
version = '0.8.0'
description = '네이버 항공권·스카이스캐너 항공권을 조회하는 LLM 친화 CLI'
readme = 'README.md'
license = 'MIT'
requires-python = '>=3.11'
keywords = [
    'flights',
    'airfare',
    'korea',
    'naver',
    'skyscanner',
    'cli',
    'llm',
    'ai-agent',
    '항공권',
    '네이버 항공권',
    '스카이스캐너',
]
classifiers = [
    'Development Status :: 3 - Alpha',
    'Environment :: Console',
    'Intended Audience :: End Users/Desktop',
    'Natural Language :: Korean',
    'Operating System :: OS Independent',
    'Programming Language :: Python :: 3 :: Only',
    'Topic :: Utilities',
]
dependencies = [
    'pydantic>=2.13,<3',
    'httpx>=0.28,<0.29',
    'tenacity>=9.1,<10',
    # cli 가 typer 에 내장된 click(typer._click)을 쓰는데 0.26 부터 들어 있다
    'typer>=0.26,<1',
    # 사이트 첫 화면을 연 위장 브라우저 안에서 요청을 보낸다 (core/browser.py). 0.x 라 새 마이너 버전은 확인한 뒤
    # 상한을 올린다. Chromium 은 pip 로 오지 않아 'baenggipyo install-browser' 로 따로 받는다
    'scrapling>=0.5,<0.6',
    # scrapling[fetchers] 대신 그 목록에서 playwright 만 빼고 적는다. scrapling 0.5 는 patchright 만 쓰고 playwright 는
    # import 하지 않는데, [fetchers] 로 받으면 playwright(설치 141MB)가 같이 깔린다 (2026-11-09 로컬 확인). curl_cffi 는
    # StealthySession 을 import 할 때 불려 뺄 수 없다. scrapling 을 올리면 그 버전의 fetchers 목록과 import 를 다시 확인한다
    # (매일 API 감시가 날마다 'pip install .' 로 새로 깔아, 0.5.x 가 import 를 바꿔도 다음 날 잡힌다).
    # 이 항목들은 상한을 두지 않는다 (docs/development/workflow.md 의 상한 규칙의 예외). scrapling 0.5 의 fetchers 목록이
    # 하한만 두어 그대로 옮겼다. 우리가 상한을 두면 scrapling 0.5.x 가 하한을 올릴 때 함께 설치할 수 없게 된다.
    # scrapling 자체는 위에서 <0.6 으로 묶어, 새 마이너 버전의 목록은 올릴 때 확인한다
    'curl_cffi>=0.16.1',
    'browserforge>=1.2.4',
    'apify-fingerprint-datapoints>=0.15.0',
    'msgspec>=0.21.1',
    'anyio>=4.14.0',
    'protego>=0.6.2',
    'click>=8.3.0',
    # core/browser.py 가 직접 import 한다. 버전마다 맞는 Chromium 빌드가 달라 올리면 Chromium 을 다시 설치해야 하므로,
    # 확인한 버전으로 묶는다
    'patchright>=1.64,<1.65',
]

[project.optional-dependencies]
dev = [
    'pytest>=8',
    'ruff>=0.17,<0.18',
    'mypy>=2.4,<3',
]

[project.urls]
Homepage = 'https://github.com/Rukkakka/baenggipyo'
Documentation = 'https://github.com/Rukkakka/baenggipyo/tree/main/docs'
Changelog = 'https://github.com/Rukkakka/baenggipyo/blob/main/CHANGELOG.md'
Issues = 'https://github.com/Rukkakka/baenggipyo/issues'

[project.scripts]
baenggipyo = 'baenggipyo.cli.app:main'

# sdist 에서는 README 그림(데모 GIF·로고)과 그 제작 도구만 뺀다. PyPI 페이지는 README 의 GitHub 주소로 그림을 보여 준다
[tool.hatch.build.targets.sdist]
exclude = ['docs/demo', 'docs/logo.svg', 'scripts/demo', 'scripts/logo']

[tool.hatch.build.targets.wheel]
packages = ['src/baenggipyo']

# `baenggipyo guide` 가 출력하는 LLM 가이드. 문서는 docs/llm.md 하나만 두고 설치본에는 패키지 안으로 복사한다
# (편집 가능 설치에는 복사되지 않아 cli/app.py 가 저장소의 docs/llm.md 를 읽는다).
[tool.hatch.build.targets.wheel.force-include]
'docs/llm.md' = 'baenggipyo/llm.md'

[tool.pytest.ini_options]
testpaths = ['tests']

# docs/development/code-style.md 의 규칙 중 도구로 잡을 수 있는 것만 켠다. 줄 길이(E501)와 ruff format 은 쓰지 않는다
# (format 은 §4 의 여러 줄 필드 선언을 한 줄로 합친다).
[tool.ruff]
target-version = 'py311'
src = ['src', 'tests']

[tool.ruff.lint]
select = [
    'F', 'E4', 'E7', 'E9',  # 안 쓰는 import·정의 안 된 이름·문법 오류
    'I',  # import 순서 (§3)
    'Q',  # 따옴표 (§2)
    'UP006', 'UP007', 'UP035', 'UP045',  # 내장 제네릭, X | None, collections.abc (§5)
    'TID252',  # 절대 import (§3)
    'ANN001', 'ANN201', 'ANN202', 'ANN205', 'ANN206',  # 타입 힌트 (§5)
]

[tool.ruff.lint.per-file-ignores]
# 패키지 re-export 는 상대 import 로 쓴다 (§3)
'**/__init__.py' = ['F401', 'TID252']
'tests/**' = ['ANN']

[tool.ruff.lint.flake8-quotes]
inline-quotes = 'single'
multiline-quotes = 'double'
docstring-quotes = 'double'

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = 'all'

[tool.ruff.lint.isort]
known-first-party = ['baenggipyo']
# typing 은 프로젝트 import 뒤 마지막 그룹 (§3)
section-order = ['future', 'standard-library', 'third-party', 'first-party', 'local-folder', 'typing']
lines-after-imports = 2

[tool.ruff.lint.isort.sections]
typing = ['typing']

[tool.mypy]
python_version = '3.11'
files = ['src']
plugins = ['pydantic.mypy']
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[tool.pydantic-mypy]
init_forbid_extra = true
