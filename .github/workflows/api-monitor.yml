# 매일 새벽 두 소스의 모든 CLI 명령을 실제로 불러 비공식 API 가 깨졌는지 본다 (scripts/monitor/api_check.py,
# docs/development/README.md '매일 API 감시'). 고장이면 api-broken 이슈를 열고(열려 있으면 댓글) 실행을 실패로 끝내 GitHub 이 메일로 알린다.
# 봇 차단·요청 제한은 고장이 아니라 '확인 못 함'이고, 같은 묶음이 사흘 연속 그러면 api-blocked 이슈로 알린다.
# 감시 파일을 고친 PR 이나 다른 브랜치의 수동 실행에서도 돌지만 이슈는 건드리지 않는다. CI(ci.yml)는 여전히 실제 API 를 부르지 않는다.
name: API 감시

on:
  schedule:
    # 한국 시간 매일 04:17. 정각은 예약 실행이 몰려 늦거나 빠진다
    - cron: '17 19 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/monitor/**'
      - '.github/workflows/api-monitor.yml'

permissions:
  contents: read

concurrency:
  group: api-monitor-${{ github.ref }}

jobs:
  check:
    name: 조회 (${{ matrix.group }})
    runs-on: ${{ matrix.os }}
    # 명령 하나의 시간 상한(api_check.py COMMAND_TIMEOUT_SECONDS 300초) × 가장 긴 묶음(네이버 12개) = 60분보다 길게 둔다.
    # 잡이 상한에 끊기면 결과 파일이 없어 고장으로 판정된다. 평소에는 2분 안팎에 끝난다 (2026-10 실행 기록)
    timeout-minutes: 65
    strategy:
      fail-fast: false
      matrix:
        # 스카이스캐너 명령을 모두 부르면 40번 남짓이라 한 러너로는 시간당 상한(30회)에 막혀 한 시간 넘게 기다리므로 국제선·국내선을 나눈다.
        # 막힌 묶음을 다른 러너로 다시 돌리지는 않는다 (막힌 날은 확인 못 함으로 남긴다).
        # 스카이스캐너 묶음은 macOS 러너에서 돈다. ubuntu·windows 러너에서는 검색·달력이 봇 차단(캡차)에 자주 막혀 확인하지 못한다
        include:
          - group: naver
            os: ubuntu-latest
          - group: skyscanner-international
            os: macos-latest
          - group: skyscanner-domestic
            os: macos-latest
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      # PyPI 릴리스가 아니라 이 커밋의 코드를 본다
      - run: pip install .
      # baenggipyo 는 네이버·스카이스캐너 요청을 모두 사이트 첫 화면을 연 Chromium 으로 보낸다 (core/browser.py). 감시도 사용자와 같은
      # 방식으로 부르므로 모든 묶음에 설치한다. Linux 러너는 비밀번호 없이 sudo 가 되어 Chromium 이 쓰는
      # 시스템 라이브러리도 깐다 (macOS 는 필요 없다). install-browser 는 받은 Chromium 을 한 번 띄워 확인까지 한다
      - name: 시스템 라이브러리 설치 (Linux)
        if: runner.os == 'Linux'
        run: sudo "$(command -v python)" -m patchright install-deps chromium
      - run: python -m baenggipyo install-browser
      - run: python scripts/monitor/api_check.py run ${{ matrix.group }} --out result-${{ matrix.group }}.json
      - uses: actions/upload-artifact@v7
        with:
          name: result-${{ matrix.group }}
          path: result-${{ matrix.group }}.json
          retention-days: 7

  report:
    name: 결과 정리
    needs: check
    # 조회 잡이 실패해도 정리한다 (결과 파일이 없는 묶음은 고장으로 본다). 실행을 취소했으면 정리하지 않는다.
    # always() 면 취소한 실행도 결과 파일이 없어 모두 고장으로 판정해 이슈를 연다
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
      # 앞선 실행의 결과 파일을 내려받아 연속 확인 못 함을 센다
      actions: read
    env:
      PYTHONUTF8: '1'
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - uses: actions/download-artifact@v8
        # 조회 잡이 모두 실패해 결과 파일이 하나도 없어도 정리 단계는 돈다
        continue-on-error: true
        with:
          pattern: result-*
          path: results
          merge-multiple: true
      # 이슈는 main 의 예약·수동 실행만 고친다. 앞선 날 결과도 같은 브랜치의 실행에서 찾는다
      - name: 표 남기기·이슈 고치기
        run: python scripts/monitor/api_check.py report results/result-*.json ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && '--issues' || '' }}
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: report
          path: report.json
          retention-days: 7
