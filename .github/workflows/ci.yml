# PR 과 main push 마다 린트·타입 검사·전체 pytest·설치본을 확인한다.
# 테스트는 가짜 응답만 쓰고 실제 API 는 부르지 않는다 (references/development.md '검증과 테스트').
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: 린트·타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check
      - run: mypy
      - name: docs/llm.md 200줄 이하
        run: |
          lines=$(wc -l < docs/llm.md)
          echo "docs/llm.md: ${lines}줄"
          if [ "$lines" -gt 200 ]; then
            echo "::error file=docs/llm.md::${lines}줄입니다. 200줄 이하로 줄이세요 (AGENTS.md '문서 갱신')"
            exit 1
          fi

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 지원하는 가장 낮은 버전과 최신 안정 버전
        python: ['3.11', '3.14']
    env:
      # README 의 Windows 설정(setx PYTHONUTF8 1)과 같게 한다. macOS·Linux 는 원래 UTF-8 이다
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest

  package:
    name: 설치본 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install build
      - run: python -m build --wheel
      # 편집 가능 설치와 달리 docs/llm.md 를 패키지 안 사본으로 읽으므로 그 사본이 빠지거나 다르면 여기서 드러난다
      - name: 새 가상환경에 설치해 실행
        run: |
          python -m venv "$RUNNER_TEMP/baenggipyo-check"
          "$RUNNER_TEMP/baenggipyo-check/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/baenggipyo-check/bin/baenggipyo" --version
          "$RUNNER_TEMP/baenggipyo-check/bin/baenggipyo" guide > "$RUNNER_TEMP/guide.md"
          diff "$RUNNER_TEMP/guide.md" docs/llm.md
