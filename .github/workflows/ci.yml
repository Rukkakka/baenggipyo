# PR 과 main push 마다 린트·타입 검사·전체 pytest·설치본을 확인한다. 배포(release.yml)도 이 워크플로를 불러 같은 검사를
# 통과한 빌드만 올린다. 잡 이름은 main 보호 규칙의 필수 검사라 바꾸면 보호 규칙도 같이 고친다.
# 브라우저·요청 제한에 관련된 파일이 바뀐 PR 은 세 운영체제에서 Chromium 을 받아 가짜 사이트로 브라우저 요청을 확인한다
# ('브라우저 확인'). PR 이 아닌 실행(main push, release.yml 이 부름)은 늘 돈다. 이 잡 이름은 필수 검사가 아니다.
# 테스트는 가짜 응답만 쓰고 실제 API 는 부르지 않는다 (docs/development/README.md '검증과 테스트').
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: 바뀐 파일 분류
    runs-on: ubuntu-latest
    outputs:
      # 브라우저에 관련된 파일이 바뀌었으면 'true'. 세 운영체제 브라우저 확인을 돌릴지 정한다
      browser: ${{ steps.classify.outputs.browser }}
    steps:
      # PR 실행은 PR 을 최신 main 에 합친 커밋에서 돈다. 그 첫 부모(main)와 비교하려고 부모까지 받는다
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - id: classify
        env:
          # 브라우저 확인을 돌릴 파일: 브라우저·http·요청 제한 계층(core/), install-browser 명령(cli/app.py), 확인 스크립트,
          # 의존성(patchright·scrapling 버전), 이 워크플로
          BROWSER_PATTERN: '^(src/baenggipyo/core/(browser|http|ratelimit)\.py$|src/baenggipyo/cli/app\.py$|scripts/ci/|pyproject\.toml$|\.github/workflows/ci\.yml$)'
        run: |
          # PR 이 아닌 실행(main push, release.yml 이 부름)이나 합친 커밋이 아니면 늘 검사한다
          if [ "$GITHUB_EVENT_NAME" != pull_request ] || ! git rev-parse -q --verify HEAD^2 > /dev/null; then
            echo "PR 합친 커밋이 아니라 브라우저 확인을 돌립니다"
            echo browser=true >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # --no-renames: 옮긴 파일의 옛 경로도 본다. 새 경로만 보면 브라우저 파일을 다른 곳으로 옮긴 PR 을 놓친다
          changed=$(git diff --no-renames --name-only HEAD^1 HEAD)
          echo "바뀐 파일:"
          echo "$changed"
          if printf '%s\n' "$changed" | grep -qE "$BROWSER_PATTERN"; then
            echo browser=true >> "$GITHUB_OUTPUT"
          else
            echo "브라우저 관련 파일이 바뀌지 않아 브라우저 확인을 건너뜁니다"
            echo browser=false >> "$GITHUB_OUTPUT"
          fi

  lint:
    name: 린트·타입 검사
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: ruff check
      - run: mypy
      - name: docs/llm.md 200줄 이하
        run: |
          lines=$(wc -l < docs/llm.md)
          echo "docs/llm.md: ${lines}줄"
          if [ "$lines" -gt 200 ]; then
            echo "::error file=docs/llm.md::${lines}줄입니다. 200줄 이하로 줄이세요 (AGENTS.md '문서 갱신')"
            exit 1
          fi

  test:
    name: pytest (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        # 지원하는 가장 낮은 버전과 최신 안정 버전
        python: ['3.11', '3.14']
    env:
      # README 의 Windows 설정(setx PYTHONUTF8 1)과 같게 한다. macOS·Linux 는 원래 UTF-8 이다
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install -e '.[dev]'
      - run: pytest

  package:
    name: 설치본 확인
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install build twine
      - run: python -m build
      # README 가 PyPI 프로젝트 페이지에서 렌더링되는지 (상대 링크는 잡지 못한다)
      - run: twine check --strict dist/*
      # 편집 가능 설치와 달리 docs/llm.md 를 패키지 안 사본으로 읽으므로 그 사본이 빠지거나 다르면 여기서 드러난다.
      # guide 는 소스 절을 뺀 공통 부분, guide <소스> 는 그 절이라 소스 절이 비지 않았는지 보고 셋을 이어 문서와 비교한다
      - name: 새 가상환경에 설치해 실행
        run: |
          python -m venv "$RUNNER_TEMP/baenggipyo-check"
          "$RUNNER_TEMP/baenggipyo-check/bin/pip" install dist/*.whl
          "$RUNNER_TEMP/baenggipyo-check/bin/baenggipyo" --version
          "$RUNNER_TEMP/baenggipyo-check/bin/baenggipyo" guide > "$RUNNER_TEMP/guide.md"
          "$RUNNER_TEMP/baenggipyo-check/bin/baenggipyo" guide naver > "$RUNNER_TEMP/guide-naver.md"
          "$RUNNER_TEMP/baenggipyo-check/bin/baenggipyo" guide skyscanner > "$RUNNER_TEMP/guide-skyscanner.md"
          test -s "$RUNNER_TEMP/guide-naver.md"
          test -s "$RUNNER_TEMP/guide-skyscanner.md"
          cat "$RUNNER_TEMP/guide.md" "$RUNNER_TEMP/guide-naver.md" "$RUNNER_TEMP/guide-skyscanner.md" | diff - docs/llm.md
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  # 이 커밋의 코드를 설치하고(pip install .) 설치된 baenggipyo 로 가짜 사이트를 열어 브라우저 요청·남긴 쿠키·막힌 응답(CORS 없는 429)
  # 알아보기·스트림(SSE) 읽기·Ctrl+C·프로세스 정리를 확인한다 (scripts/ci/browser_check.py). pytest 는 Chromium 을 띄우지 않아
  # 운영체제마다 달라지는 브라우저 쪽은 여기서만 본다. 실제 사이트에는 요청하지 않는다
  browser:
    name: 브라우저 확인 (${{ matrix.os }})
    needs: changes
    if: needs.changes.outputs.browser == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    env:
      # README 의 Windows 설정(setx PYTHONUTF8 1)과 같게 한다 (Windows 한글 출력용). macOS·Linux 는 원래 UTF-8 이다
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: pip install .
      # Chromium 이 쓰는 시스템 라이브러리. Linux 러너는 비밀번호 없이 sudo 가 된다. macOS·Windows 는 필요 없다
      - name: 시스템 라이브러리 설치 (Linux)
        if: runner.os == 'Linux'
        run: sudo "$(command -v python)" -m patchright install-deps chromium
      # 확인 스크립트가 띄울 Chromium 을 먼저 받는다
      - run: python -m baenggipyo install-browser
      - run: python scripts/ci/browser_check.py
      # 이미 있을 때 다시 받지 않고 건너뛰는지 본다
      - run: python -m baenggipyo install-browser
